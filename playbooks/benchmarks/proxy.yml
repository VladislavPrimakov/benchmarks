---
- name: Run ProxyServerBenchmark
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files: [../vars/common.yml]
  environment: "{{ bench_env }}"

  tasks:
    - name: Setup environment and dependencies
      ansible.builtin.include_tasks: ../tasks/setup.yml
      vars:
        deps: [bombardier, dotnet, nginx]

    - name: Compile ProxyServerBenchmark
      ansible.builtin.include_tasks: ../tasks/compile.yml
      vars:
        dotnet_projects:
          - src/WebServerBenchmark/cs/WebServerBenchmark.csproj

    - name: Copy nginx benchmark config into ~/.bench-tools/nginx
      ansible.builtin.copy:
        src: "{{ root_dir }}/src/WebServerBenchmark/nginx/nginx.conf"
        dest: "{{ nginx_dir }}/conf/nginx.conf"
        mode: "0644"

    - name: Run ProxyServer Benchmarks
      block:
        - name: Start backend API server in background
          ansible.builtin.shell:
            cmd: "nohup ./src/WebServerBenchmark/cs/bin/Release/jit/WebServerBenchmark --urls 'http://127.0.0.1:5000' --mode api </dev/null >/dev/null 2>&1 & echo $!"
            chdir: "{{ root_dir }}"
          register: _backend_api
          changed_when: false

        - name: Wait for backend API server on port 5000
          ansible.builtin.wait_for:
            host: 127.0.0.1
            port: 5000
            timeout: "{{ port_timeout }}"

        - name: Benchmark proxies sequentially
          ansible.builtin.include_tasks: ../tasks/bench_http.yml
          loop:
            - name: "YARP (JIT)"
              start_cmd: "nohup ./src/WebServerBenchmark/cs/bin/Release/jit/WebServerBenchmark --urls 'http://127.0.0.1:5001' --mode yarp </dev/null >/dev/null 2>&1 & echo $!"
              port: 5001
              out: proxy_yarp_jit.json
            - name: "YARP (AOT)"
              start_cmd: "nohup ./src/WebServerBenchmark/cs/bin/Release/aot/WebServerBenchmark --urls 'http://127.0.0.1:5004' --mode yarp </dev/null >/dev/null 2>&1 & echo $!"
              port: 5004
              out: proxy_yarp_aot.json
            - name: "Nginx"
              start_cmd: "{{ nginx_dir }}/sbin/nginx -p '{{ nginx_dir }}' -c '{{ nginx_dir }}/conf/nginx.conf'"
              stop_cmd: "{{ nginx_dir }}/sbin/nginx -p '{{ nginx_dir }}' -c '{{ nginx_dir }}/conf/nginx.conf' -s quit"
              port: 5002
              out: proxy_nginx.json
          loop_control:
            loop_var: target
            label: "{{ target.name }}"

      always:
        - name: Stop backend API server
          ansible.builtin.shell: "kill -TERM {{ _backend_api.stdout | trim }} 2>/dev/null || true"
          when: (_backend_api.stdout | default('') | trim) != ''
          ignore_errors: true
          changed_when: false

        - name: Force kill any lingering process on backend port 5000
          ansible.builtin.shell: "fuser -k 5000/tcp 2>/dev/null || kill -9 $(lsof -t -i:5000) 2>/dev/null || true"
          ignore_errors: true
          changed_when: false

    - name: Update README.md
      ansible.builtin.include_tasks: ../tasks/update_readme.yml
      vars:
        readme_section: proxy
